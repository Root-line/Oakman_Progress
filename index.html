<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oakman Build Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.28.5/babel.min.js"></script>
  <style>
    body {
      background-color: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Inline SVG Icons (Zero external icon dependencies) ---
    const Icon = ({ path, className = "w-4 h-4", viewBox = "0 0 24 24" }) => (
      <svg className={className} viewBox={viewBox} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {path}
      </svg>
    );

    const Icons = {
      Lock: (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />,
      Unlock: (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></>} />,
      Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
      Settings: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />,
      Check: (p) => <Icon {...p} path={<polyline points="20 6 9 17 4 12"/>} />,
      CheckCircle: (p) => <Icon {...p} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
      Alert: (p) => <Icon {...p} path={<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
      ChevronDown: (p) => <Icon {...p} path={<polyline points="6 9 12 15 18 9"/>} />,
      ChevronRight: (p) => <Icon {...p} path={<polyline points="9 18 15 12 9 6"/>} />,
      X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
      Calendar: (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
      Trash: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />,
      Search: (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />,
      Wifi: (p) => <Icon {...p} path={<><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></>} />,
      Shield: (p) => <Icon {...p} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>} />,
      Flame: (p) => <Icon {...p} path={<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>} />,
      Wrench: (p) => <Icon {...p} path={<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>} />,
      Droplet: (p) => <Icon {...p} path={<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>} />,
      Building: (p) => <Icon {...p} path={<><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="12"/><line x1="15" y1="12" x2="15" y2="22"/><line x1="9" y1="6" x2="9.01" y2="6"/><line x1="15" y1="6" x2="15.01" y2="6"/></>} />,
      Download: (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
      Upload: (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
      Eye: (p) => <Icon {...p} path={<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>} />,
    };

    // --- Constants & Metadata ---
    const scheduleClient = window.supabase.createClient(
      "https://fltetxghyzgectpkeohy.supabase.co",
      "sb_publishable_z394WucABvx7KQgOmEackw_MB__GhLo",
      { auth: { storageKey: "oakman-build-schedule-auth" } }
    );
    const scheduleRow = () => scheduleClient.from("oakman_build_schedule");
    const emptySchedule = { projectMeta: {}, events: [], rooms: [], doorFaults: [], inspections: [] };

    const isSchedule = (value) =>
      value?.projectMeta && typeof value.projectMeta.name === "string" &&
      ["events", "rooms", "doorFaults", "inspections"].every((key) => Array.isArray(value[key])) &&
      value.rooms.every((room) => room?.id && room.step1 && room.step2) &&
      [value.events, value.doorFaults, value.inspections].every((items) => items.every((item) => item?.id));

    const TRACKS = [
      { id: "ops_buildout", pillar: "operations", label: "Building Five-Room Expansion", color: "#10b981", badge: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30" },
      { id: "ops_fertigation", pillar: "operations", label: "Fertigation Replacement", color: "#06b6d4", badge: "bg-cyan-500/15 text-cyan-300 border-cyan-500/30" },
      { id: "ops_equipment", pillar: "operations", label: "Existing Room Equipment Certification", color: "#f59e0b", badge: "bg-amber-500/15 text-amber-300 border-amber-500/30" },
      { id: "ops_pressure", pillar: "operations", label: "CO₂ / Positive Pressure", color: "#14b8a6", badge: "bg-teal-500/15 text-teal-300 border-teal-500/30" },
      { id: "comms", pillar: "communications", label: "Low Voltage", color: "#8b5cf6", badge: "bg-violet-500/15 text-violet-300 border-violet-500/30" },
      { id: "security", pillar: "operations", label: "Perimeter / Interior Security", color: "#3b82f6", badge: "bg-blue-500/15 text-blue-300 border-blue-500/30" },
      { id: "external", pillar: "operations", label: "External Upgrades", color: "#ec4899", badge: "bg-pink-500/15 text-pink-300 border-pink-500/30" },
      { id: "license", pillar: "license", label: "License Activity (CRA/BFS)", color: "#ef4444", badge: "bg-red-500/15 text-red-300 border-red-500/30" },
    ];

    const STATUSES = ["Not Started", "In Progress", "Scheduled", "Needs Review", "Blocked", "Complete", "Approved"];
    const PRIORITIES = ["Low", "Medium", "High", "Critical"];
    const EQUIP_ACTIONS = ["New Purchase", "Replacement", "Modification", "Maintenance"];

    const STATUS_COLORS = {
      "Complete": { pill: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40", bar: "#10b981" },
      "Approved": { pill: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40", bar: "#10b981" },
      "In Progress": { pill: "bg-sky-500/20 text-sky-300 border-sky-500/40", bar: "#0ea5e9" },
      "Scheduled": { pill: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40", bar: "#6366f1" },
      "Needs Review": { pill: "bg-amber-500/20 text-amber-300 border-amber-500/40", bar: "#f59e0b" },
      "Blocked": { pill: "bg-rose-500/20 text-rose-300 border-rose-500/40", bar: "#f43f5e" },
      "Not Started": { pill: "bg-slate-700/50 text-slate-300 border-slate-600/50", bar: "#64748b" },
    };

    const EQUIP_BADGES = {
      "New Purchase": "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
      "Replacement": "bg-rose-500/15 text-rose-300 border-rose-500/30",
      "Modification": "bg-violet-500/15 text-violet-300 border-violet-500/30",
      "Maintenance": "bg-amber-500/15 text-amber-300 border-amber-500/30",
    };

    const isDone = (status) => status === "Complete" || status === "Approved";
    const openPrerequisites = (dependencies) => dependencies.filter((dependency) => dependency && !isDone(dependency.status));

    const calcDays = (start, end) => {
      if (!start || !end) return 0;
      const d1 = new Date(start + "T00:00:00");
      const d2 = new Date(end + "T00:00:00");
      if (isNaN(d1) || isNaN(d2)) return 0;
      return Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
    };

    const fmtDate = (d) => {
      if (!d) return "TBD";
      const dt = new Date(d + "T00:00:00");
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    };

    function eventTiming(event) {
      if (event.startDate && event.endDate && event.startDate !== event.endDate) {
        return `${fmtDate(event.startDate)} – ${fmtDate(event.endDate)} (${calcDays(event.startDate, event.endDate)}d)`;
      }
      if (event.startDate && event.endDate) return fmtDate(event.startDate);
      if (event.startDate) return `Starts ${fmtDate(event.startDate)}`;
      if (event.endDate) return `Ends ${fmtDate(event.endDate)}`;
      if (event.plannedDays) return `${event.plannedDays} planned days · dates TBD`;
      return isDone(event.status) ? "Undated" : "Dates TBD";
    }

    function OakmanBuildSchedule() {
      const [published, setPublished] = useState(null);
      const [draft, setDraft] = useState(null);
      const [isEditor, setIsEditor] = useState(false);
      const [isPublishing, setIsPublishing] = useState(false);
      const [loadError, setLoadError] = useState("");
      const [publishError, setPublishError] = useState("");
      const [lastPublished, setLastPublished] = useState(false);
      const latestRead = useRef(0);
      const publishInFlight = useRef(false);
      const data = draft?.data ?? published?.data ?? emptySchedule;
      const isUnlocked = isEditor && Boolean(published);
      const hasChanges = Boolean(draft);
      const hasConflict = hasChanges && published?.revision > draft.revision;

      const [activeTab, setActiveTab] = useState("overview");
      const [opsSubTab, setOpsSubTab] = useState("buildout");
      const [showPassModal, setShowPassModal] = useState(false);
      const [emailInput, setEmailInput] = useState("");
      const [signInMessage, setSignInMessage] = useState("");
      const [signInError, setSignInError] = useState("");
      const [sendingLink, setSendingLink] = useState(false);
      const [showSettings, setShowSettings] = useState(false);

      const [selectedEventId, setSelectedEventId] = useState(null);
      const [showQuickLog, setShowQuickLog] = useState(false);

      // Filters
      const [ganttFilter, setGanttFilter] = useState("all");
      const [expandedTracks, setExpandedTracks] = useState({ ops_buildout: true, license: true });
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("All");
      const [equipActionFilter, setEquipActionFilter] = useState("All");

      const loadPublished = async () => {
        const request = ++latestRead.current;
        const { data: row, error } = await scheduleRow()
          .select("data, revision, updated_at").eq("id", 1).single();
        if (request !== latestRead.current) return;
        if (error || !isSchedule(row?.data)) {
          setLoadError("Could not load the published schedule. Try again.");
          return;
        }
        setPublished((current) => current?.revision > row.revision ? current : row);
        setLoadError("");
      };

      useEffect(() => {
        const sync = () => { if (!document.hidden) void loadPublished(); };
        sync();
        const timer = window.setInterval(sync, 30000);
        window.addEventListener("focus", sync);
        document.addEventListener("visibilitychange", sync);
        return () => {
          window.clearInterval(timer);
          window.removeEventListener("focus", sync);
          document.removeEventListener("visibilitychange", sync);
          latestRead.current++;
        };
      }, []);

      useEffect(() => {
        let currentRequest = 0;
        const { data: { subscription } } = scheduleClient.auth.onAuthStateChange((_event, session) => {
          const request = ++currentRequest;
          if (!session) {
            setIsEditor(false);
            return;
          }
          // Leave the auth callback before making another Supabase request.
          window.setTimeout(async () => {
            const { data: permitted, error } = await scheduleClient.rpc("oakman_can_edit");
            if (request !== currentRequest) return;
            setIsEditor(permitted === true && !error);
            if (permitted === true && !error) setShowPassModal(false);
          }, 0);
        });
        return () => {
          currentRequest++;
          subscription.unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!hasChanges) return;
        const warn = (event) => { event.preventDefault(); event.returnValue = ""; };
        window.addEventListener("beforeunload", warn);
        return () => window.removeEventListener("beforeunload", warn);
      }, [hasChanges]);

      const selectedEvent = useMemo(
        () => data.events.find((e) => e.id === selectedEventId) || null,
        [data.events, selectedEventId]
      );

      // KPIs
      const kpis = useMemo(() => {
        const total = data.events.length;
        const done = data.events.filter((e) => isDone(e.status)).length;
        const active = data.events.filter((e) => e.status === "In Progress" || e.status === "Scheduled").length;
        const attention = data.events.filter((e) => e.status === "Blocked" || e.status === "Needs Review").length;
        const openFaults = data.doorFaults.filter((d) => d.status !== "Resolved").length;

        const totalChecks = data.rooms.length * 9;
        const doneChecks = data.rooms.reduce((acc, r) => {
          const s1 = Object.values(r.step1).filter(Boolean).length;
          const s2 = Object.values(r.step2).filter(Boolean).length;
          return acc + s1 + s2;
        }, 0);

        return {
          total,
          done,
          pct: total ? Math.round((done / total) * 100) : 0,
          active,
          attention,
          openFaults,
          roomPct: totalChecks ? Math.round((doneChecks / totalChecks) * 100) : 0,
        };
      }, [data]);

      const handleUnlockSubmit = async (event) => {
        event.preventDefault();
        if (sendingLink) return;
        setSendingLink(true);
        setSignInError("");
        setSignInMessage("");
        try {
          const { error } = await scheduleClient.auth.signInWithOtp({
            email: emailInput.trim().toLowerCase(),
            options: { emailRedirectTo: window.location.origin + "/" },
          });
          if (error) throw error;
          setSignInMessage("Check your email for the sign-in link.");
        } catch (error) {
          setSignInError(error.message || "Could not send the sign-in link.");
        } finally {
          setSendingLink(false);
        }
      };

      const requireEdit = () => {
        if (!isUnlocked) {
          setShowPassModal(true);
          return false;
        }
        return !publishInFlight.current && !hasConflict;
      };

      const updateDraft = (update) => {
        setLastPublished(false);
        setDraft((current) => ({
          revision: current?.revision ?? published.revision,
          data: update(current?.data ?? published.data),
        }));
      };

      const publishSchedule = async () => {
        if (!draft || !requireEdit()) return;
        publishInFlight.current = true;
        setIsPublishing(true);
        setPublishError("");
        try {
          const { data: row, error } = await scheduleRow().update({ data: draft.data })
            .eq("id", 1).eq("revision", draft.revision)
            .select("data, revision, updated_at").maybeSingle();
          if (error) throw error;
          if (!row) {
            await loadPublished();
            throw new Error("Could not publish. Check your sign-in and the latest published version.");
          }
          setPublished((current) => current?.revision > row.revision ? current : row);
          setDraft(null);
          setLastPublished(true);
        } catch (error) {
          setPublishError(error.message || "Could not publish the schedule.");
        } finally {
          publishInFlight.current = false;
          setIsPublishing(false);
        }
      };

      const discardDraft = () => {
        if (publishInFlight.current || !window.confirm("Discard your unpublished edits?")) return;
        setDraft(null);
        setPublishError("");
        void loadPublished();
      };

      const lockEditing = async () => {
        if (publishInFlight.current) return;
        if (draft && !window.confirm("Sign out and discard your unpublished edits?")) return;
        const { error } = await scheduleClient.auth.signOut({ scope: "local" });
        if (error) {
          setPublishError("Could not sign out. Try again.");
          return;
        }
        setDraft(null);
        setPublishError("");
        setSignInMessage("");
      };

      // Data Mutators
      const updateEvent = (id, patch) => {
        if (!requireEdit()) return;
        updateDraft((prev) => ({
          ...prev,
          events: prev.events.map((ev) => (ev.id === id ? { ...ev, ...patch } : ev)),
        }));
      };

      const addEventNote = (id, text) => {
        if (!requireEdit() || !text.trim()) return;
        const today = new Date().toISOString().slice(0, 10);
        updateDraft((prev) => ({
          ...prev,
          events: prev.events.map((ev) =>
            ev.id === id ? { ...ev, notes: [{ ts: today, text: text.trim() }, ...(ev.notes || [])] } : ev
          ),
        }));
      };

      const deleteEvent = (id) => {
        if (!requireEdit()) return;
        updateDraft((prev) => ({
          ...prev,
          events: prev.events.filter((ev) => ev.id !== id),
        }));
        setSelectedEventId(null);
      };

      const addNewEvent = (evObj) => {
        if (!requireEdit()) return;
        const id = "ev-" + crypto.randomUUID();
        updateDraft((prev) => ({
          ...prev,
          events: [...prev.events, { ...evObj, id }],
        }));
        setShowQuickLog(false);
      };

      const toggleRoomCheck = (roomId, stepKey, field) => {
        if (!requireEdit()) return;
        updateDraft((prev) => ({
          ...prev,
          rooms: prev.rooms.map((r) =>
            r.id === roomId ? { ...r, [stepKey]: { ...r[stepKey], [field]: !r[stepKey][field] } } : r
          ),
        }));
      };

      const updateRoomMeta = (roomId, field, value) => {
        if (!requireEdit()) return;
        updateDraft((prev) => ({
          ...prev,
          rooms: prev.rooms.map((r) => (r.id === roomId ? { ...r, [field]: value } : r)),
        }));
      };

      const addDoorFault = (fault) => {
        if (!requireEdit()) return;
        const id = "df-" + crypto.randomUUID();
        updateDraft((prev) => ({
          ...prev,
          doorFaults: [{ ...fault, id }, ...prev.doorFaults],
        }));
      };

      const cycleDoorFaultStatus = (id) => {
        if (!requireEdit()) return;
        const order = ["Open", "In Progress", "Resolved"];
        updateDraft((prev) => ({
          ...prev,
          doorFaults: prev.doorFaults.map((d) =>
            d.id === id ? { ...d, status: order[(order.indexOf(d.status) + 1) % order.length] } : d
          ),
        }));
      };

      const deleteDoorFault = (id) => {
        if (!requireEdit()) return;
        updateDraft((prev) => ({ ...prev, doorFaults: prev.doorFaults.filter((d) => d.id !== id) }));
      };

      const addInspection = (ins) => {
        if (!requireEdit()) return;
        const id = "ins-" + crypto.randomUUID();
        updateDraft((prev) => ({
          ...prev,
          inspections: [{ ...ins, id }, ...prev.inspections],
        }));
      };

      const deleteInspection = (id) => {
        if (!requireEdit()) return;
        updateDraft((prev) => ({ ...prev, inspections: prev.inspections.filter((i) => i.id !== id) }));
      };

      // Export / Import
      const handleExportJSON = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Oakman_Build_Schedule_Backup.json";
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportJSON = async (event) => {
        if (!requireEdit()) return;
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        try {
          const { passcode, ...backup } = JSON.parse(await file.text());
          if (!isSchedule(backup)) throw new Error("Invalid backup file format.");
          if (!requireEdit()) return;
          updateDraft(() => backup);
          setShowSettings(false);
        } catch (error) {

    function OverviewView({ data, kpis, ganttFilter, setGanttFilter, expandedTracks, setExpandedTracks, onSelectEvent, onJumpTab }) {
      const visibleTracks = useMemo(() => {
        if (ganttFilter === "all") return TRACKS;
        return TRACKS.filter((t) => t.pillar === ganttFilter);
      }, [ganttFilter]);

      // Compute Gantt calendar bounds
      const timelineBounds = useMemo(() => {
        const dated = data.events.filter((e) => e.startDate || e.endDate);
        if (!dated.length) {
          return { start: new Date("2026-02-01T00:00:00"), end: new Date("2026-05-31T00:00:00"), months: [] };
        }
        let minMs = Math.min(...dated.map((e) => new Date((e.startDate || e.endDate) + "T00:00:00").getTime()));
        let maxMs = Math.max(...dated.map((e) => new Date((e.endDate || e.startDate) + "T00:00:00").getTime()));
        const start = new Date(minMs);
        start.setDate(1);
        const end = new Date(maxMs);
        end.setMonth(end.getMonth() + 1, 0);

        const months = [];
        const cur = new Date(start);
        while (cur <= end) {
          const mStart = new Date(cur);
          const mEnd = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
          months.push({
            label: cur.toLocaleDateString("en-US", { month: "short", year: "2-digit" }),
            startMs: mStart.getTime(),
            endMs: mEnd.getTime(),
          });
          cur.setMonth(cur.getMonth() + 1, 1);
        }
        return { start, end, startMs: start.getTime(), endMs: end.getTime(), totalMs: Math.max(1, end.getTime() - start.getTime()), months };
      }, [data.events]);

      const getBarStyle = (sDate, eDate) => {
        if (!sDate || !eDate) return null;
        const s = new Date(sDate + "T00:00:00").getTime();
        const e = new Date(eDate + "T00:00:00").getTime() + 86400000;
        const left = Math.max(0, ((s - timelineBounds.startMs) / timelineBounds.totalMs) * 100);
        const right = Math.min(100, ((e - timelineBounds.startMs) / timelineBounds.totalMs) * 100);
        const width = Math.max(1.5, right - left);
        return { left: `${left}%`, width: `${width}%` };
      };

      const toggleAllTracks = (expand) => {
        const next = {};
        TRACKS.forEach((t) => { next[t.id] = expand; });

      };

      const recentNotes = useMemo(() => {
        const list = [];

            list.push({ ...n, eventId: ev.id, eventTitle: ev.title, track: ev.track });

              </div>
            </div>

            <div className="bg-[#111827] border border-slate-800 rounded-xl p-4">
              <div className="text-xs text-slate-400">5-Room Readiness</div>
              <div className="mt-1 flex items-baseline gap-2">
                <span className="text-2xl font-bold text-emerald-400">{kpis.roomPct}%</span>
                <span className="text-xs text-slate-400">Step 1 & 2</span>
              </div>
              <div className="mt-2 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div className="h-full bg-emerald-400 rounded-full" style={{ width: `${kpis.roomPct}%` }} />
              </div>
            </div>

            <div className="bg-[#111827] border border-slate-800 rounded-xl p-4">
              <div className="text-xs text-slate-400">Active / Scheduled</div>
              <div className="mt-1 text-2xl font-bold text-sky-400">{kpis.active}</div>
              <div className="mt-1 text-[11px] text-slate-400">In-flight workstreams</div>
            </div>

              <div className="mt-1 text-2xl font-bold text-amber-400">{kpis.attention}</div>
              <div className="mt-1 text-[11px] text-slate-400">Blocked / Review</div>
            </div>

            <div className="bg-[#111827] border border-slate-800 rounded-xl p-4 col-span-2 lg:col-span-1">
              <div className="text-xs text-slate-400">Open Door Faults</div>
              <div className="mt-1 text-2xl font-bold text-violet-400">{kpis.openFaults}</div>
              <div className="mt-1 text-[11px] text-slate-400">Comms & Access Log</div>
            </div>
          </div>

          {/* Interactive Master Gantt Chart */}
          <section className="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden">
            <div className="p-4 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 className="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                  <Icons.Calendar className="w-4 h-4 text-emerald-400" /> Master Build-Out Gantt Chart
                </h2>
                <p className="text-xs text-slate-400">Expand any pillar track to inspect individual event bars. Click any bar to open details.</p>
              </div>
              <div className="flex flex-wrap items-center gap-1.5">
                {[
                  { id: "all", label: "All Pillars" },
                  { id: "operations", label: "Operations" },
                  { id: "communications", label: "Low Voltage" },
                  { id: "license", label: "License" },

                  <button
                    key={f.id}
                    onClick={() => setGanttFilter(f.id)}
                    className={`px-2.5 py-1 text-xs rounded-lg border transition ${
                      ganttFilter === f.id
                        ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/40"
                        : "bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200"
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
                <button
                  onClick={() => toggleAllTracks(true)}
                  className="px-2.5 py-1 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 ml-1"
                >
                  Expand All
                </button>
                <button
                  onClick={() => toggleAllTracks(false)}
                  className="px-2.5 py-1 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                >
                  Collapse
                </button>
              </div>
            </div>

            <div className="overflow-x-auto">
              <div className="min-w-[780px]">
                {/* Calendar Month Header */}
                <div className="grid grid-cols-12 bg-slate-900/80 border-b border-slate-800 text-xs font-semibold text-slate-400">
                  <div className="col-span-4 px-4 py-2.5 border-r border-slate-800">Pillar / Build Event</div>
                  <div className="col-span-8 relative flex">
                    {timelineBounds.months.map((m, idx) => (
                      <div
                        key={idx}
                        className="flex-1 text-center py-2.5 border-r border-slate-800/70 last:border-r-0"
                      >
                        {m.label}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Track Rows */}
                {visibleTracks.map((track) => {
                  const evs = data.events
                    .filter((e) => e.track === track.id)
                    .sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
                  const startDates = evs.map((e) => e.startDate || e.endDate).filter(Boolean).sort();
                  const endDates = evs.map((e) => e.endDate || e.startDate).filter(Boolean).sort();
                  const trackStart = startDates[0];
                  const trackEnd = endDates.at(-1);
                  const trackDone = evs.filter((e) => isDone(e.status)).length;
                  const trackPct = evs.length ? Math.round((trackDone / evs.length) * 100) : 0;
                  const barStyle = getBarStyle(trackStart, trackEnd);
                  const isExp = !!expandedTracks[track.id];

                  return (
                    <div key={track.id} className="border-b border-slate-800/80 last:border-b-0">
                      {/* Pillar Summary Bar Row */}
                      <div
                        onClick={() => setExpandedTracks((prev) => ({ ...prev, [track.id]: !prev[track.id] }))}
                        className="grid grid-cols-12 items-center hover:bg-slate-800/40 cursor-pointer transition"
                      >
                        <div className="col-span-4 px-3 py-3 border-r border-slate-800 flex items-center justify-between gap-2">
                          <div className="flex items-center gap-2 min-w-0">
                            {isExp ? <Icons.ChevronDown className="w-4 h-4 text-slate-400 shrink-0" /> : <Icons.ChevronRight className="w-4 h-4 text-slate-400 shrink-0" />}
                            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: track.color }} />
                            <span className="text-xs sm:text-sm font-semibold text-white truncate">{track.label}</span>
                          </div>
                          <span className="text-[11px] text-slate-400 shrink-0">{trackPct}% ({evs.length})</span>
                        </div>
                        <div className="col-span-8 relative h-11 flex items-center">
                          {/* Month Gridlines */}
                          <div className="absolute inset-0 flex pointer-events-none">
                            {timelineBounds.months.map((_, idx) => (
                              <div key={idx} className="flex-1 border-r border-slate-800/50 last:border-r-0" />
                            ))}
                          </div>
                          {barStyle && (
                            <div
                              className="absolute h-6 rounded-md overflow-hidden border border-white/10 shadow-sm flex items-center"
                              style={{ ...barStyle, backgroundColor: track.color + "33" }}
                            >
                              <div
                                className="h-full transition-all"
                                style={{ width: `${trackPct}%`, backgroundColor: track.color }}
                              />
                              <span className="absolute inset-0 px-2 flex items-center text-[10px] font-semibold text-white drop-shadow truncate">
                                {fmtDate(trackStart)} – {fmtDate(trackEnd)}
                              </span>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Expanded Event Sub-Bars */}
                      {isExp && evs.map((ev) => {
                        const evStyle = getBarStyle(ev.startDate || ev.endDate, ev.endDate || ev.startDate);
                        const stColor = STATUS_COLORS[ev.status]?.bar || "#64748b";
                        return (
                          <div
                            key={ev.id}
                            onClick={() => onSelectEvent(ev.id)}
                            className="grid grid-cols-12 items-center bg-[#0c1220] hover:bg-slate-800/60 cursor-pointer border-t border-slate-800/50 transition"
                          >
                            <div className="col-span-4 pl-9 pr-3 py-2 border-r border-slate-800 flex items-center justify-between gap-2">
                              <span className="text-xs text-slate-300 truncate">{ev.title}</span>
                              <span className={`text-[10px] px-1.5 py-0.5 rounded border shrink-0 ${STATUS_COLORS[ev.status]?.pill || ""}`}>
                                {ev.status}
                              </span>
                            </div>
                            <div className="col-span-8 relative h-9 flex items-center">
                              <div className="absolute inset-0 flex pointer-events-none">
                                {timelineBounds.months.map((_, idx) => (
                                  <div key={idx} className="flex-1 border-r border-slate-800/40 last:border-r-0" />
                                ))}
                              </div>
                              {evStyle && (
                                <div
                                  className="absolute h-5 rounded px-2 flex items-center text-[10px] font-medium text-white shadow truncate hover:brightness-110"
                                  style={{ ...evStyle, backgroundColor: stColor }}
                                  title={`${ev.title} (${ev.startDate} to ${ev.endDate})`}
                                >
                                  <span className="truncate">{eventTiming(ev)}</span>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* Bottom Split: Quick Pillar Cards + Recent Field Log */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
              {[
                { title: "Building Five-Room Expansion", desc: "Convert five spaces into flower rooms.", tab: "operations", sub: "buildout", trackId: "ops_buildout" },
                { title: "Fertigation Replacement", desc: "Demolition, replacement tanks, mixing equipment, and room lines.", tab: "operations", sub: "fertigation", trackId: "ops_fertigation" },
                { title: "Low Voltage", desc: "Switch repair, device readdressing, access, cameras, and alarms.", tab: "communications", trackId: "comms" },
                { title: "License Activity (CRA/BFS)", desc: "Detroit License secured; tracking BFS Fire & CRA walkthrough.", tab: "license", trackId: "license" },
              ].map((card) => {
                const evs = data.events.filter((e) => e.track === card.trackId);
                const done = evs.filter((e) => isDone(e.status)).length;
                return (
                  <button
                    key={card.title}
                    onClick={() => onJumpTab(card.tab, card.sub)}
                    className="text-left bg-[#111827] hover:bg-slate-800/70 border border-slate-800 hover:border-slate-700 rounded-xl p-4 transition"
                  >
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-bold text-white">{card.title}</h3>
                      <span className="text-xs text-emerald-400 font-semibold">{done}/{evs.length}</span>
                    </div>
                    <p className="text-xs text-slate-400 mt-1">{card.desc}</p>
                  </button>
                );
              })}
            </div>

            <div className="bg-[#111827] border border-slate-800 rounded-xl p-4">
              <h3 className="text-sm font-bold text-white mb-3">Recent Field Log</h3>
              {recentNotes.length === 0 ? (
                <p className="text-xs text-slate-500">No field notes logged yet.</p>
              ) : (
                <div className="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                  {recentNotes.map((n, idx) => (
                    <div
                      key={idx}
                      onClick={() => onSelectEvent(n.eventId)}
                      className="p-2.5 rounded-lg bg-slate-900/80 border border-slate-800 hover:border-slate-700 cursor-pointer"
                    >
                      <div className="flex items-center justify-between text-[11px] text-slate-400 mb-0.5">
                        <span className="font-semibold text-emerald-300 truncate">{n.eventTitle}</span>
                        <span className="shrink-0 ml-2">{n.ts}</span>
                      </div>
                      <p className="text-xs text-slate-300">{n.text}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- TAB 2: Operations (Build Out, Fertigation, Existing Equipment) ---
    function OperationsView({
      data, opsSubTab, setOpsSubTab, isUnlocked, searchQuery, setSearchQuery,
      statusFilter, setStatusFilter, equipActionFilter, setEquipActionFilter,
      onSelectEvent, onToggleRoomCheck, onUpdateRoomMeta
    }) {
      const sections = [
        { id: "buildout", track: "ops_buildout" },
        { id: "fertigation", track: "ops_fertigation" },
        { id: "equipment", track: "ops_equipment" },
        { id: "pressure", track: "ops_pressure" },
        { id: "security", track: "security" },
        { id: "external", track: "external" },
      ];
      const currentTrack = sections.find((section) => section.id === opsSubTab)?.track;

      const filteredEvents = useMemo(() => {
        return data.events.filter((ev) => {
          if (ev.track !== currentTrack) return false;
          if (statusFilter !== "All" && ev.status !== statusFilter) return false;
          if (opsSubTab === "equipment" && equipActionFilter !== "All" && ev.actionType !== equipActionFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return (ev.title || "").toLowerCase().includes(q) || (ev.area || "").toLowerCase().includes(q) || (ev.owner || "").toLowerCase().includes(q);
          }
          return true;
        });
      }, [data.events, currentTrack, statusFilter, opsSubTab, equipActionFilter, searchQuery]);

      const step1Labels = [
        { k: "demo", label: "Demo/Prep" },
        { k: "walls", label: "Walls/Sealed" },
        { k: "electrical", label: "Electrical" },
        { k: "hvac", label: "HVAC" },
        { k: "co2Rough", label: "CO2 Rough-In" },
      ];
      const step2Labels = [
        { k: "lightsTables", label: "Lights/Tables" },
        { k: "dehusFans", label: "Dehus/Fans" },
        { k: "co2TieIn", label: "CO2 Alarms" },
        { k: "bfsReady", label: "BFS Ready" },
      ];

      return (
        <div className="space-y-5">
          {/* Sub-Tab Selector */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="inline-flex flex-wrap bg-[#111827] border border-slate-800 rounded-xl p-1 gap-1">
              {sections.map((s) => (
                <button
                  key={s.id}
                  onClick={() => setOpsSubTab(s.id)}
                  aria-pressed={opsSubTab === s.id}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
                    opsSubTab === s.id ? "bg-emerald-600 text-white" : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  {TRACKS.find((track) => track.id === s.track)?.label}
                </button>
              ))}
            </div>

            {/* Filter Bar */}
            <div className="flex flex-wrap items-center gap-2">
              <div className="relative">
                <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" />
                <input
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search events..."
                  className="bg-[#111827] border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
              </div>
              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
                className="bg-[#111827] border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200"
              >
                <option value="All">All Statuses</option>
                {STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          {/* 5-Room Sequenced Conversion Tracker */}
          {opsSubTab === "buildout" && (
            <section className="space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-sm font-bold text-white flex items-center gap-2">
                  <Icons.Building className="w-4 h-4 text-emerald-400" /> 5-Room Conversion Sequence (Step 1 Reconstruction → Step 2 Equipment)
                </h2>
                {!isUnlocked && <span className="text-[11px] text-slate-400">Unlock to toggle checkboxes or rename rooms</span>}
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {data.rooms.map((rm) => {
                  const s1Done = Object.values(rm.step1).filter(Boolean).length;
                  const s2Done = Object.values(rm.step2).filter(Boolean).length;
                  const pct = Math.round(((s1Done + s2Done) / 9) * 100);
                  return (
                    <div key={rm.id} className="bg-[#111827] border border-slate-800 rounded-xl p-4 space-y-3">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex-1 min-w-0">
                          {isUnlocked ? (
                            <input
                              value={rm.name}
                              onChange={(e) => onUpdateRoomMeta(rm.id, "name", e.target.value)}
                              className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-0.5 text-sm font-bold text-white"
                            />
                          ) : (
                            <h3 className="text-sm font-bold text-white truncate">{rm.name}</h3>
                          )}
                          <div className="flex items-center gap-2 mt-1 text-[11px] text-slate-400">
                            {isUnlocked ? (
                              <input
                                value={rm.dims}
                                onChange={(e) => onUpdateRoomMeta(rm.id, "dims", e.target.value)}
                                className="w-full bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5 text-[11px] text-slate-300"
                              />
                            ) : (
                              <span>{rm.sourceSpace} • {rm.dims}</span>
                            )}
                          </div>
                        </div>
                        <span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                          {pct}%
                        </span>
                      </div>

                      <div>
                        <div className="text-[10px] font-semibold uppercase tracking-wider text-sky-400 mb-1.5">
                          Step 1: Reconstruction ({s1Done}/5)
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {step1Labels.map((item) => {
                            const checked = !!rm.step1[item.k];
                            return (
                              <button
                                key={item.k}
                                onClick={() => onToggleRoomCheck(rm.id, "step1", item.k)}
                                className={`text-[11px] px-2 py-1 rounded-md border flex items-center gap-1 transition ${
                                  checked
                                    ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/40"
                                    : "bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700"
                                }`}
                              >
                                {checked && <Icons.Check className="w-3 h-3" />} {item.label}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div>
                        <div className="text-[10px] font-semibold uppercase tracking-wider text-amber-400 mb-1.5">
                          Step 2: Equipment Install ({s2Done}/4)
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {step2Labels.map((item) => {
                            const checked = !!rm.step2[item.k];
                            return (
                              <button
                                key={item.k}
                                onClick={() => onToggleRoomCheck(rm.id, "step2", item.k)}
                                className={`text-[11px] px-2 py-1 rounded-md border flex items-center gap-1 transition ${
                                  checked
                                    ? "bg-amber-500/20 text-amber-300 border-amber-500/40"
                                    : "bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700"
                                }`}
                              >
                                {checked && <Icons.Check className="w-3 h-3" />} {item.label}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>
          )}

          {/* Equipment Action Filter Pills */}
          {opsSubTab === "equipment" && (
            <div className="flex flex-wrap items-center gap-1.5">
              {["All", ...EQUIP_ACTIONS].map((act) => (
                <button
                  key={act}
                  onClick={() => setEquipActionFilter(act)}
                  className={`px-2.5 py-1 text-xs rounded-lg border transition ${
                    equipActionFilter === act
                      ? "bg-amber-500/20 text-amber-300 border-amber-500/40"
                      : "bg-[#111827] text-slate-400 border-slate-800 hover:text-slate-200"
                  }`}
                >
                  {act}
                </button>
              ))}
            </div>
          )}

          {/* Event Cards Grid */}
          <EventCardGrid events={filteredEvents} allEvents={data.events} onSelectEvent={onSelectEvent} />
        </div>
      );
    }

    // --- TAB 3: Communications & Door Faults ---
    function CommunicationsView({ data, isUnlocked, onSelectEvent, onAddDoorFault, onCycleDoorFaultStatus, onDeleteDoorFault }) {
      const commsEvents = data.events.filter((e) => e.track === "comms");
      const [door, setDoor] = useState("");
      const [issue, setIssue] = useState("");
      const [severity, setSeverity] = useState("High");
      const [notes, setNotes] = useState("");

      const handleAdd = (e) => {
        e.preventDefault();
        if (!door.trim() || !issue.trim()) return;
        onAddDoorFault({
          door: door.trim(),
          issue: issue.trim(),
          severity,
          status: "Open",
          date: new Date().toISOString().slice(0, 10),
          notes: notes.trim(),
        });
        setDoor("");
        setIssue("");
        setNotes("");
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-sm font-bold text-white flex items-center gap-2 mb-3">
              <Icons.Wifi className="w-4 h-4 text-violet-400" /> Low Voltage
            </h2>
            <EventCardGrid events={commsEvents} allEvents={data.events} onSelectEvent={onSelectEvent} />
          </div>

          {/* Door Operation & Faults Log */}
          <section className="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-sm font-bold text-white flex items-center gap-2">
                  <Icons.Alert className="w-4 h-4 text-amber-400" /> Door Operation & Faults Log
                </h3>
                <p className="text-xs text-slate-400">Track badge readers, mag-locks, strikes, and door hardware faults.</p>
              </div>
              <span className="text-xs text-slate-400">{data.doorFaults.filter((d) => d.status !== "Resolved").length} Open</span>
            </div>

            {isUnlocked && (
              <form onSubmit={handleAdd} className="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-slate-900/70 p-3 rounded-xl border border-slate-800">
                <input
                  value={door}
                  onChange={(e) => setDoor(e.target.value)}
                  placeholder="Door location (e.g., Vault / Room 2)"
                  className="sm:col-span-3 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                />
                <input
                  value={issue}
                  onChange={(e) => setIssue(e.target.value)}
                  placeholder="Fault description..."
                  className="sm:col-span-4 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                />
                <select
                  value={severity}
                  onChange={(e) => setSeverity(e.target.value)}
                  className="sm:col-span-2 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200"
                >
                  {PRIORITIES.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
                <input
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Action / note"
                  className="sm:col-span-2 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                />
                <button type="submit" className="sm:col-span-1 bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold rounded-lg py-1.5">
                  Add
                </button>
              </form>
            )}

            <div className="space-y-2">
              {data.doorFaults.map((df) => (
                <div key={df.id} className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <div className="space-y-0.5">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-white">{df.door}</span>
                      <span className={`text-[10px] px-1.5 py-0.5 rounded border ${
                        df.severity === "Critical" || df.severity === "High"
                          ? "bg-rose-500/15 text-rose-300 border-rose-500/30"
                          : "bg-amber-500/15 text-amber-300 border-amber-500/30"
                      }`}>
                        {df.severity}
                      </span>
                      <span className="text-[11px] text-slate-500">{df.date}</span>
                    </div>
                    <p className="text-xs text-slate-300">{df.issue}</p>
                    {df.notes && <p className="text-[11px] text-slate-400 italic">Note: {df.notes}</p>}
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => onCycleDoorFaultStatus(df.id)}
                      className={`text-xs font-semibold px-2.5 py-1 rounded-lg border transition ${
                        df.status === "Resolved"
                          ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/40"
                          : df.status === "In Progress"

    // --- Shared Event Card Grid ---
    function EventCardGrid({ events, allEvents, onSelectEvent }) {
      const eventsById = new Map(allEvents.map((event) => [event.id, event]));

        return <div className="bg-[#111827] border border-slate-800 rounded-xl p-8 text-center text-xs text-slate-500">No events match your current filter.</div>;
      }
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          {events.map((ev) => {
            const blockers = ev.status === "Blocked"
              ? openPrerequisites((ev.dependsOn || []).map((id) => eventsById.get(id)))
              : [];
            return (
              <div
                key={ev.id}
                onClick={() => onSelectEvent(ev.id)}
                className="bg-[#111827] hover:bg-slate-800/60 border border-slate-800 hover:border-slate-700 rounded-xl p-4 cursor-pointer transition flex flex-col justify-between gap-3"

                  <div className="flex items-center justify-between gap-2">
                    <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 truncate">
                      {ev.subGroup || ev.area}
                    </span>
                    <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full border shrink-0 ${STATUS_COLORS[ev.status]?.pill || ""}`}>
                      {ev.status}
                    </span>

                  <h3 className="text-sm font-bold text-white leading-snug">{ev.title}</h3>
                  {blockers.length > 0 && (
                    <p className="text-xs text-rose-300">
                      <strong>Blocked by</strong> {blockers.map((blocker) => blocker.title).join(", ")}
                    </p>
                  )}
                  {ev.summary && <p className="text-xs text-slate-300">{ev.summary}</p>}
                  <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
                    {ev.actionType && (
                      <span className={`text-[10px] px-1.5 py-0.5 rounded border ${EQUIP_BADGES[ev.actionType] || ""}`}>
                        {ev.actionType}
                      </span>

                  <label className="text-[11px] text-slate-400">Status</label>
                  <select value={status} onChange={(e) => setStatus(e.target.value)} className="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white">
                    {STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[11px] text-slate-400">Priority</label>
                  <select value={priority} onChange={(e) => setPriority(e.target.value)} className="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white">
                    {PRIORITIES.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="text-[11px] text-slate-400">Initial Field Note</label>
                <textarea rows="3" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Optional details or delay context..." className="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
              </div>
              <div className="flex justify-end gap-2 pt-3">
                <button type="button" onClick={onClose} className="px-3 py-2 text-xs rounded-lg bg-slate-800 text-slate-300">Cancel</button>
                <button type="submit" className="px-4 py-2 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white">Save Event</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<OakmanBuildSchedule />);
  </script>
</body>
</html>
